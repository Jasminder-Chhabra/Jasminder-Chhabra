name: Generate contribution snake

# Renders the contribution graph as an animated snake and pushes the SVGs to the
# `output` branch, which the README links to.
#
# NOTE: this reads the PUBLIC contribution graph. If "Include private
# contributions on my profile" is off in Settings → Profile, the graph is empty
# and the snake will have nothing to eat.

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7C3AED&color_dots=#1B1530,#4C1D95,#6D28D9,#7C3AED,#EDE9FE
            dist/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EFEBE0,#EDE9FE,#A78BFA,#7C3AED,#4C1D95

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
